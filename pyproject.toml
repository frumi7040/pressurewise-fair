
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pressurewise-fair"
version = "0.1.0"
description = "An equity-aware framework for pressure management in water distribution networks."
requires-python = ">=3.10"
dependencies = [
    "wntr",
    "six>=1.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
